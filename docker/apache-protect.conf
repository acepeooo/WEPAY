# Estas carpetas solo deben ser leídas por PHP (require_once / file_put_contents),
# nunca servidas directamente por Apache.
<Directory "/var/www/html/includes">
    Require all denied
</Directory>

<Directory "/var/www/html/data">
    Require all denied
</Directory>

<Directory "/var/www/html/backups">
    Require all denied
</Directory>
